<svg
  xmlns="http://www.w3.org/2000/svg"
  width="960"
  height="620"
  viewBox="0 0 960 620"
  font-family="Arial, sans-serif"
>
  <defs>
    <marker
      id="arr"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto"
    >
      <path d="M0 0L10 5L0 10Z" fill="#465d68" />
    </marker>
  </defs>
  <rect width="960" height="620" fill="#fff" />
  <text x="32" y="38" font-size="23" fill="#29343a">
    One output-dependency graph, two different execution designs
  </text>
  <text x="32" y="70" font-size="16" fill="#29343a">
    Node = execution unit. Arrow = the receiver needs the sender’s output.
  </text>
  <rect x="375" y="95" width="210" height="54" rx="8" fill="#f3f6f7" stroke="#aebdc3" />
  <text x="401" y="129" font-size="19" fill="#29343a">Draft proof</text>
  <rect x="155" y="195" width="210" height="54" rx="8" fill="#f3f6f7" stroke="#aebdc3" />
  <text x="181" y="229" font-size="19" fill="#29343a">Check A</text>
  <rect x="595" y="195" width="210" height="54" rx="8" fill="#f3f6f7" stroke="#aebdc3" />
  <text x="621" y="229" font-size="19" fill="#29343a">Check B</text>
  <rect x="375" y="295" width="210" height="54" rx="8" fill="#f3f6f7" stroke="#aebdc3" />
  <text x="401" y="329" font-size="19" fill="#29343a">Finalize proof</text>
  <path d="M405 149L285 194" stroke="#465d68" stroke-width="2" fill="none" marker-end="url(#arr)" />
  <path d="M555 149L675 194" stroke="#465d68" stroke-width="2" fill="none" marker-end="url(#arr)" />
  <path d="M285 249L405 294" stroke="#465d68" stroke-width="2" fill="none" marker-end="url(#arr)" />
  <path d="M675 249L555 294" stroke="#465d68" stroke-width="2" fill="none" marker-end="url(#arr)" />
  <rect x="32" y="385" width="432" height="150" rx="8" fill="#fdf1e9" stroke="#b5541c" />
  <text x="50" y="416" font-size="20" fill="#29343a">Design A: parallel review</text>
  <text x="50" y="451" font-size="16" fill="#29343a">Same review instructions for A and B.</text>
  <text x="50" y="478" font-size="16" fill="#29343a">Each receives the complete draft.</text>
  <text x="50" y="505" font-size="16" fill="#29343a">Neither receives the other’s findings.</text>
  <rect x="496" y="385" width="432" height="150" rx="8" fill="#fdf1e9" stroke="#b5541c" />
  <text x="514" y="416" font-size="20" fill="#29343a">Design B: specialist review</text>
  <text x="514" y="451" font-size="16" fill="#29343a">A checks the algebraic expansion.</text>
  <text x="514" y="478" font-size="16" fill="#29343a">B checks logic and integer assumptions.</text>
  <text x="514" y="505" font-size="16" fill="#29343a">
    Each receives the material for its obligation.
  </text>
  <text x="32" y="575" font-size="17" fill="#29343a">
    The edges are identical. Reviewer instructions and available evidence are different.
  </text>
  <text x="32" y="603" font-size="15" fill="#29343a">
    Topology retains a chosen relation; it omits these details unless they are annotated.
  </text>
</svg>

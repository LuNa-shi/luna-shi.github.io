<svg
  xmlns="http://www.w3.org/2000/svg"
  width="960"
  height="460"
  viewBox="0 0 960 460"
  font-family="Arial, sans-serif"
>
  <rect width="960" height="460" fill="#fff" />
  <text x="32" y="38" font-size="23" fill="#333">Three conditions configure a running agent</text>
  <text x="32" y="68" font-size="15" fill="#333">
    Example: repair a parser while preserving its behavior on non-empty input.
  </text>
  <rect
    x="32.0"
    y="95"
    width="289.3333333333333"
    height="104"
    rx="8"
    fill="#f3f6f7"
    stroke="#aebdc3"
  />
  <text x="46.0" y="123" font-size="19" fill="#333">Task</text>
  <text x="46.0" y="150" font-size="14" fill="#333">Outcome + scope</text>
  <text x="46.0" y="172" font-size="14" fill="#333">Handle empty input; preserve behavior</text>
  <rect
    x="333.3333333333333"
    y="95"
    width="289.3333333333333"
    height="104"
    rx="8"
    fill="#f3f6f7"
    stroke="#aebdc3"
  />
  <text x="347.3333333333333" y="123" font-size="19" fill="#333">Environment</text>
  <text x="347.3333333333333" y="150" font-size="14" fill="#333">State + interaction access</text>
  <text x="347.3333333333333" y="172" font-size="14" fill="#333">
    Working copy; read, edit and test
  </text>
  <rect
    x="634.6666666666666"
    y="95"
    width="289.3333333333333"
    height="104"
    rx="8"
    fill="#f3f6f7"
    stroke="#aebdc3"
  />
  <text x="648.6666666666666" y="123" font-size="19" fill="#333">Capacity</text>
  <text x="648.6666666666666" y="150" font-size="14" fill="#333">
    Action selection + available actions
  </text>
  <text x="648.6666666666666" y="172" font-size="14" fill="#333">
    Model and instructions; file/test tools
  </text>
  <text x="32" y="238" font-size="19" fill="#333">Agent execution: repeated interaction</text>
  <rect x="32" y="260" width="204" height="54" rx="8" fill="#fdf1e9" stroke="#b5541c" />
  <text x="50" y="294" font-size="18" fill="#333">Observe</text>
  <text x="241" y="293" font-size="20" fill="#333">→</text>
  <rect x="260" y="260" width="204" height="54" rx="8" fill="#fdf1e9" stroke="#b5541c" />
  <text x="278" y="294" font-size="18" fill="#333">Choose</text>
  <text x="469" y="293" font-size="20" fill="#333">→</text>
  <rect x="488" y="260" width="204" height="54" rx="8" fill="#fdf1e9" stroke="#b5541c" />
  <text x="506" y="294" font-size="18" fill="#333">Act</text>
  <text x="697" y="293" font-size="20" fill="#333">→</text>
  <rect x="716" y="260" width="204" height="54" rx="8" fill="#fdf1e9" stroke="#b5541c" />
  <text x="734" y="294" font-size="18" fill="#333">Feedback</text>
  <path d="M 890 321 L 890 339 L 50 339 L 50 321" fill="none" stroke="#b5541c" stroke-width="2" />
  <text x="405" y="363" font-size="14" fill="#b5541c">repeat as needed</text>
  <text x="32" y="400" font-size="15" fill="#333">
    An edit changes the working copy. A failing test informs the next decision.
  </text>
  <text x="32" y="424" font-size="15" fill="#333">
    The setup can remain fixed while the state, history and next action change.
  </text>
</svg>

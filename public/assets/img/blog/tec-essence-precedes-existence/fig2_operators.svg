<svg
  xmlns="http://www.w3.org/2000/svg"
  width="960"
  height="460"
  viewBox="0 0 960 460"
  font-family="Arial, sans-serif"
>
  <rect width="960" height="460" fill="#fff" />
  <text x="32" y="38" font-size="23" fill="#333">Five operators organize execution</text>
  <text x="32" y="68" font-size="15" fill="#333">
    These are organizational operations, not every transition or a mandatory linear sequence.
  </text>
  <rect x="32.0" y="95" width="172.0" height="104" rx="8" fill="#f3f6f7" stroke="#aebdc3" />
  <text x="46.0" y="123" font-size="19" fill="#333">generate</text>
  <text x="46.0" y="150" font-size="14" fill="#333">Create or refine</text>
  <text x="46.0" y="172" font-size="14" fill="#333">the request</text>
  <rect x="216.0" y="95" width="172.0" height="104" rx="8" fill="#f3f6f7" stroke="#aebdc3" />
  <text x="230.0" y="123" font-size="19" fill="#333">match</text>
  <text x="230.0" y="150" font-size="14" fill="#333">Choose capacity</text>
  <text x="230.0" y="172" font-size="14" fill="#333">and access</text>
  <rect x="400.0" y="95" width="172.0" height="104" rx="8" fill="#f3f6f7" stroke="#aebdc3" />
  <text x="414.0" y="123" font-size="19" fill="#333">assemble</text>
  <text x="414.0" y="150" font-size="14" fill="#333">Select observations</text>
  <text x="414.0" y="172" font-size="14" fill="#333">and history</text>
  <rect x="584.0" y="95" width="172.0" height="104" rx="8" fill="#f3f6f7" stroke="#aebdc3" />
  <text x="598.0" y="123" font-size="19" fill="#333">verify</text>
  <text x="598.0" y="150" font-size="14" fill="#333">Assess a</text>
  <text x="598.0" y="172" font-size="14" fill="#333">candidate result</text>
  <rect x="768.0" y="95" width="172.0" height="104" rx="8" fill="#f3f6f7" stroke="#aebdc3" />
  <text x="782.0" y="123" font-size="19" fill="#333">evolve</text>
  <text x="782.0" y="150" font-size="14" fill="#333">Revise reusable</text>
  <text x="782.0" y="172" font-size="14" fill="#333">configuration</text>
  <text x="32" y="238" font-size="19" fill="#333">Agent execution: repeated interaction</text>
  <rect x="32" y="260" width="204" height="54" rx="8" fill="#fdf1e9" stroke="#b5541c" />
  <text x="50" y="294" font-size="18" fill="#333">Observe</text>
  <text x="241" y="293" font-size="20" fill="#333">→</text>
  <rect x="260" y="260" width="204" height="54" rx="8" fill="#fdf1e9" stroke="#b5541c" />
  <text x="278" y="294" font-size="18" fill="#333">Choose</text>
  <text x="469" y="293" font-size="20" fill="#333">→</text>
  <rect x="488" y="260" width="204" height="54" rx="8" fill="#fdf1e9" stroke="#b5541c" />
  <text x="506" y="294" font-size="18" fill="#333">Act</text>
  <text x="697" y="293" font-size="20" fill="#333">→</text>
  <rect x="716" y="260" width="204" height="54" rx="8" fill="#fdf1e9" stroke="#b5541c" />
  <text x="734" y="294" font-size="18" fill="#333">Feedback</text>
  <path d="M 890 321 L 890 339 L 50 339 L 50 321" fill="none" stroke="#b5541c" stroke-width="2" />
  <text x="405" y="363" font-size="14" fill="#b5541c">repeat as needed</text>
  <text x="32" y="400" font-size="15" fill="#333">
    Assembly and checking can recur; writing a draft already changes the workspace.
  </text>
  <text x="32" y="424" font-size="15" fill="#333">
    Evolve uses run records to change later setups. Evaluate improvement separately (§6.6).
  </text>
</svg>

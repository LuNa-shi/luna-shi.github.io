<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img">
  <title>Three conditions. One running agent.</title>
  <desc>Builder contributes to the proof of infinitely many primes congruent to 3 modulo 4.</desc>
  <rect width="960" height="520" fill="#fff" />
  <style>
    text {
      font-family: Arial, sans-serif;
      fill: #27312f;
    }
    .muted {
      fill: #52645e;
    }
    .accent {
      fill: #aa501e;
    }
  </style>
  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="6"
      markerHeight="6"
      orient="auto"
    >
      <path d="M0 0L10 5L0 10Z" fill="#aa501e" />
    </marker>
  </defs>
  <text x="32" y="42" font-size="25" class="">Three conditions. One running agent.</text>
  <text x="32" y="73" font-size="16" class="muted">
    Builder contributes to the proof of infinitely many primes congruent to 3 modulo 4.
  </text>
  <rect x="32" y="105" width="286" height="116" rx="8" fill="#f4f7f5" stroke="#bdcbc3" />
  <text x="48" y="133" font-size="19" class="">Task</text>
  <text x="48" y="160" font-size="15" class="muted">Construct N with residue 3 mod 4</text>
  <text x="48" y="183" font-size="15" class="muted">and no prime divisor in S.</text>
  <rect x="337" y="105" width="286" height="116" rx="8" fill="#f4f7f5" stroke="#bdcbc3" />
  <text x="353" y="133" font-size="19" class="">Environment</text>
  <text x="353" y="160" font-size="15" class="muted">Library, assumptions and module;</text>
  <text x="353" y="183" font-size="15" class="muted">search and check observations.</text>
  <rect x="642" y="105" width="286" height="116" rx="8" fill="#f4f7f5" stroke="#bdcbc3" />
  <text x="658" y="133" font-size="19" class="">Capacity</text>
  <text x="658" y="160" font-size="15" class="muted">Select proof steps; search types,</text>
  <text x="658" y="183" font-size="15" class="muted">write terms and request checks.</text>
  <text x="32" y="270" font-size="20" class="">
    Builder’s execution develops through interaction
  </text>
  <rect x="32" y="295" width="210" height="100" rx="8" fill="#f4f7f5" stroke="#bdcbc3" />
  <text x="48" y="323" font-size="19" class="">Observe</text>
  <text x="48" y="350" font-size="15" class="muted">Read S and the interface.</text>
  <line
    x1="245"
    y1="340"
    x2="256"
    y2="340"
    stroke="#aa501e"
    stroke-width="2"
    marker-end="url(#arrow)"
  />
  <rect x="260" y="295" width="210" height="100" rx="8" fill="#f4f7f5" stroke="#bdcbc3" />
  <text x="276" y="323" font-size="19" class="">Choose</text>
  <text x="276" y="350" font-size="15" class="muted">Try N = 4P + 1.</text>
  <line
    x1="473"
    y1="340"
    x2="484"
    y2="340"
    stroke="#aa501e"
    stroke-width="2"
    marker-end="url(#arrow)"
  />
  <rect x="488" y="295" width="210" height="100" rx="8" fill="#f4f7f5" stroke="#bdcbc3" />
  <text x="504" y="323" font-size="19" class="">Act</text>
  <text x="504" y="350" font-size="15" class="muted">Submit the residue proof.</text>
  <line
    x1="701"
    y1="340"
    x2="712"
    y2="340"
    stroke="#aa501e"
    stroke-width="2"
    marker-end="url(#arrow)"
  />
  <rect x="716" y="295" width="210" height="100" rx="8" fill="#f4f7f5" stroke="#bdcbc3" />
  <text x="732" y="323" font-size="19" class="">Feedback</text>
  <text x="732" y="350" font-size="15" class="muted">Residue fails; try 4P − 1.</text>
  <text x="32" y="443" font-size="17" class="">
    A new observation changes the next action. The task, model and tools can stay fixed.
  </text>
  <text x="32" y="479" font-size="17" class="accent">
    The setup is specified before the run; the trajectory is produced during it.
  </text>
</svg>

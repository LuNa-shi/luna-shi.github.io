<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img">
  <title>Five operators organize execution.</title>
  <desc>
    Assembly and checking recur within the proof; evolve changes reusable future configuration.
  </desc>
  <rect width="960" height="560" fill="#fff" />
  <style>
    text {
      font-family: Arial, sans-serif;
      fill: #27312f;
    }
    .muted {
      fill: #52645e;
    }
    .accent {
      fill: #aa501e;
    }
  </style>
  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="6"
      markerHeight="6"
      orient="auto"
    >
      <path d="M0 0L10 5L0 10Z" fill="#aa501e" />
    </marker>
  </defs>
  <text x="32" y="42" font-size="25" class="">Five operators organize execution.</text>
  <text x="32" y="73" font-size="16" class="muted">
    Assembly and checking recur within the proof; evolve changes reusable future configuration.
  </text>
  <rect x="32" y="113" width="172" height="122" rx="8" fill="#f4f7f5" stroke="#bdcbc3" />
  <text x="48" y="141" font-size="19" class="">generate</text>
  <text x="48" y="168" font-size="15" class="muted">Fix the target</text>
  <text x="48" y="191" font-size="15" class="muted">and branch interfaces.</text>
  <line
    x1="206"
    y1="169"
    x2="211"
    y2="169"
    stroke="#aa501e"
    stroke-width="2"
    marker-end="url(#arrow)"
  />
  <rect x="213" y="113" width="172" height="122" rx="8" fill="#f4f7f5" stroke="#bdcbc3" />
  <text x="229" y="141" font-size="19" class="">match</text>
  <text x="229" y="168" font-size="15" class="muted">Assign capacities</text>
  <text x="229" y="191" font-size="15" class="muted">with needed access.</text>
  <line
    x1="387"
    y1="169"
    x2="392"
    y2="169"
    stroke="#aa501e"
    stroke-width="2"
    marker-end="url(#arrow)"
  />
  <rect x="394" y="113" width="172" height="122" rx="8" fill="#f4f7f5" stroke="#bdcbc3" />
  <text x="410" y="141" font-size="19" class="">assemble</text>
  <text x="410" y="168" font-size="15" class="muted">Select theorem types</text>
  <text x="410" y="191" font-size="15" class="muted">and current feedback.</text>
  <line
    x1="568"
    y1="169"
    x2="573"
    y2="169"
    stroke="#aa501e"
    stroke-width="2"
    marker-end="url(#arrow)"
  />
  <rect x="575" y="113" width="172" height="122" rx="8" fill="#f4f7f5" stroke="#bdcbc3" />
  <text x="591" y="141" font-size="19" class="">verify</text>
  <text x="591" y="168" font-size="15" class="muted">Check contracts</text>
  <text x="591" y="191" font-size="15" class="muted">and the root target.</text>
  <line
    x1="749"
    y1="169"
    x2="754"
    y2="169"
    stroke="#aa501e"
    stroke-width="2"
    marker-end="url(#arrow)"
  />
  <rect x="756" y="113" width="172" height="122" rx="8" fill="#f4f7f5" stroke="#bdcbc3" />
  <text x="772" y="141" font-size="19" class="">evolve</text>
  <text x="772" y="168" font-size="15" class="muted">Evaluate and retain</text>
  <text x="772" y="191" font-size="15" class="muted">a reusable procedure.</text>
  <rect x="32" y="276" width="896" height="96" rx="8" fill="#f4f7f5" stroke="#bdcbc3" />
  <text x="48" y="304" font-size="19" class="">
    Current proof: Integrator · Builder · Factor · Auditor
  </text>
  <text x="48" y="331" font-size="15" class="muted">
    Observe → choose → act → feedback → repeat. Work changes the shared environment.
  </text>
  <rect x="32" y="397" width="896" height="105" rx="8" fill="#f4f7f5" stroke="#bdcbc3" />
  <text x="48" y="425" font-size="19" class="">Future execution: a saved retrieval procedure</text>
  <text x="48" y="452" font-size="15" class="muted">
    Use the trace to propose a change. Compare old and new versions on held-out tasks.
  </text>
  <text x="48" y="475" font-size="15" class="muted">
    Preserve the external objective, report costs and regressions, then adopt a version.
  </text>
</svg>
